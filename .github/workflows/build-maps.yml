name: Build offline maps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # Monthly refresh from the latest OpenStreetMap data.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install road builder dependencies
        run: pip install osmium numpy
      - name: Download Planetiler
        run: curl -fsSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
      - name: Download Saudi Arabia OpenStreetMap data
        run: |
          mkdir -p data/sources
          curl -fL --retry 5 --retry-delay 30 -o data/sources/saudi-arabia.osm.pbf \
            https://download.openstreetmap.fr/extracts/asia/saudi_arabia-latest.osm.pbf \
          || curl -fL --retry 5 --retry-delay 30 -o data/sources/saudi-arabia.osm.pbf \
            https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          ls -lh data/sources
      - name: Build road network for offline routing and speed limits
        run: python build_roads.py data/sources/saudi-arabia.osm.pbf saudi-roads.navr
      - name: Verify road network with real trips
        run: python verify_roads.py saudi-roads.navr
      - name: Build place index for offline search
        run: python build_places.py data/sources/saudi-arabia.osm.pbf saudi-places.navp
      - name: Verify place index
        run: python verify_places.py saudi-places.navp
      - name: Build Saudi Arabia map (OpenMapTiles schema, zoom 0-14)
        run: java -Xmx10g -jar planetiler.jar --download --osm-path=data/sources/saudi-arabia.osm.pbf --output=saudi-arabia.pmtiles --maxzoom=14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="maps-$(date -u +%Y%m%d-%H%M)"
          ls -lh saudi-arabia.pmtiles saudi-roads.navr saudi-places.navp
          gh release create "$TAG" saudi-arabia.pmtiles saudi-roads.navr saudi-places.navp --repo "$GITHUB_REPOSITORY" --latest \
            --title "خريطة السعودية $(date -u +%Y-%m-%d)" \
            --notes "بيانات © OpenStreetMap contributors (ODbL) • مخطط OpenMapTiles • بُنيت بـ Planetiler • شبكة الطرق والأماكن للملاحة والبحث دون إنترنت."
